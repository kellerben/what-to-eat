<!doctype html>
<html lang="en">
	<!--#include virtual="/head.shtml"-->
	<body>
		<div id="root" class="row">
			<div class="col"></div>

			<div class="col-lg-8">
				<!--#set var="active" value="fetch"-->
				<!--#include virtual="/nav.shtml"-->

				<div>
					<h1>Run state of today’s shops</h1>
					<table
						class="table table-bordered table-striped table-hover table-condensed"
					>
						<thead>
							<tr>
								<th>Food Store</th>
								<th>State</th>
							</tr>
						</thead>
						<tbody>
							<tr v-for="runState in runStates">
								<td>{{runState.shop}}</td>
								<td>
									<button
										:class="stateButtonClass(runState.state, 'NEW')"
										title="Reset the run state to NEW (e.g. if it was set by accident)"
										v-on:click="setRunState(runState.shop, 'NEW')"
										:disabled="runState.state === null || runState.state === 'NEW'"
									>
										✨ New
									</button>
									<button
										:class="stateButtonClass(runState.state, 'ORDERED')"
										title="Call to the restaurant is placed"
										v-on:click="setRunState(runState.shop, 'ORDERED')"
										:disabled="runState.state === null || runState.state === 'ORDERED'"
									>
										📞 Ordered
									</button>
									<button
										:class="stateButtonClass(runState.state, 'RECEIVED')"
										title="Food received at the restaurant, fetcher is on the way back"
										v-on:click="setRunState(runState.shop, 'RECEIVED')"
										:disabled="runState.state === null || runState.state === 'RECEIVED'"
									>
										🛍️ Received
									</button>
									<button
										:class="stateButtonClass(runState.state, 'FETCHED')"
										title="Fetcher is back, food has arrived"
										v-on:click="setRunState(runState.shop, 'FETCHED')"
										:disabled="runState.state === null || runState.state === 'FETCHED'"
									>
										😋 Fetched
									</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div>
					<h1>Orders of today</h1>
					<div id="orders">
						<vue-good-table
							:rows="orders"
							:columns="header"
							:sort-options="sortOpts"
							style-class="vgt-table table table-bordered table-striped table-hover table-condensed"
							:group-options="{ enabled: true }"
						>
						</vue-good-table>
					</div>
				</div>

				<div>
					<h1>Prices of Today’s Orders</h1>
				</div>
				<table
					class="table table-bordered table-striped table-hover table-condensed"
				>
					<thead>
						<tr>
							<th>Shop</th>
							<th>Meal</th>
							<th>Price</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody>
						<tr v-for="p in prices">
							<td>{{p.shop}}</td>
							<td>{{p.meal}}</td>
							<td>
								<input
									type="number"
									class="form-control"
									v-model="p.price"
									placeholder="Price in Cent"
								/>
							</td>
							<td>
								<button
									class="btn btn-primary btn-sm"
									v-on:click="updatePrice(p)"
								>
									update
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="col"></div>
		</div>

		<!--#include virtual="/foot.shtml"-->
	</body>
</html>
